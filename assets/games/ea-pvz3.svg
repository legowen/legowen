<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120d33"/><stop offset=".6" stop-color="#3a1b5c"/><stop offset="1" stop-color="#8a3470"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a4c"/><stop offset="1" stop-color="#0a3526"/>
    </linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fffbd0"/><stop offset=".3" stop-color="#ffe45c"/><stop offset="1" stop-color="#ffe45c" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon"><stop offset="0" stop-color="#fff3d6" stop-opacity=".55"/><stop offset="1" stop-color="#fff3d6" stop-opacity="0"/></radialGradient>
    <pattern id="pickets" width="20" height="44" patternUnits="userSpaceOnUse"><path d="M3 44V12l7-10 7 10v32z" fill="#1a1036"/></pattern>
    <mask id="crescent"><rect width="640" height="360" fill="#fff"/><circle cx="566" cy="58" r="27" fill="#000"/></mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="40" cy="36" r="1.4" opacity=".8"/><circle cx="96" cy="70" r="1" opacity=".6"/><circle cx="210" cy="28" r="1.6" opacity=".9"/><circle cx="268" cy="64" r="1" opacity=".6"/><circle cx="350" cy="34" r="1.3" opacity=".8"/><circle cx="470" cy="22" r="1" opacity=".7"/><circle cx="510" cy="92" r="1.2" opacity=".6"/><circle cx="610" cy="120" r="1" opacity=".6"/><circle cx="30" cy="110" r="1" opacity=".5"/><circle cx="420" cy="104" r="1" opacity=".5"/></g>
  <circle cx="548" cy="62" r="64" fill="url(#moon)"/>
  <circle cx="548" cy="62" r="30" fill="#fff0cf" mask="url(#crescent)"/>
  <!-- fence along the horizon -->
  <rect y="134" width="640" height="44" fill="url(#pickets)"/>
  <rect y="150" width="640" height="5" fill="#1a1036"/><rect y="166" width="640" height="5" fill="#1a1036"/>
  <!-- lawn lanes -->
  <rect y="176" width="640" height="184" fill="url(#lawn)"/>
  <g fill="#ffffff"><rect y="176" width="640" height="37" opacity=".07"/><rect y="250" width="640" height="37" opacity=".07"/><rect y="324" width="640" height="36" opacity=".07"/></g>
  <g stroke="#000" stroke-opacity=".18" stroke-width="2"><path d="M0 213H640M0 250H640M0 287H640M0 324H640"/></g>
  <rect y="173" width="640" height="3" fill="#4dff9a" opacity=".85"/>
  <rect y="170" width="640" height="9" fill="#4dff9a" opacity=".25" filter="url(#soft)"/>
  <!-- seed-packet style tiles floating over the lanes -->
  <g stroke="#4dff9a" stroke-opacity=".55" stroke-width="2" fill="#4dff9a" fill-opacity=".08">
    <rect x="86" y="222" width="54" height="54" rx="9"/><rect x="214" y="259" width="54" height="54" rx="9"/><rect x="372" y="222" width="54" height="54" rx="9"/>
  </g>
  <g fill="#4dff9a" fill-opacity=".7"><circle cx="113" cy="249" r="9"/><circle cx="241" cy="286" r="9"/><circle cx="399" cy="249" r="9"/></g>
  <!-- glowing sun orbs -->
  <circle cx="150" cy="92" r="46" fill="url(#sun)"/><circle cx="318" cy="118" r="30" fill="url(#sun)"/><circle cx="446" cy="70" r="24" fill="url(#sun)"/>
  <!-- foreground leaves -->
  <path d="M-10 372C0 318 46 282 112 292 82 306 70 332 74 372z" fill="#2fe07a"/>
  <path d="M30 372C30 340 62 318 106 322 84 336 82 352 86 372z" fill="#17a655"/>
  <path d="M650 372C640 322 594 290 534 300 560 314 574 338 572 372z" fill="#2fe07a"/>
  <path d="M610 372C612 344 584 326 548 330 566 342 566 356 562 372z" fill="#17a655"/>
</svg>
