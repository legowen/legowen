<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="bricks" width="64" height="32" patternUnits="userSpaceOnUse">
      <rect width="64" height="32" fill="#272b44"/>
      <rect x="2" y="2" width="60" height="12" fill="#2f3454"/><rect x="2" y="18" width="28" height="12" fill="#2f3454"/><rect x="34" y="18" width="28" height="12" fill="#2b3050"/>
      <path d="M0 0H64M0 16H64M0 32H64M0 0V16M32 16V32" stroke="#101225" stroke-width="3" fill="none"/>
    </pattern>
    <radialGradient id="door" cx=".5" cy=".72" r=".75"><stop offset="0" stop-color="#ffe3a1"/><stop offset=".35" stop-color="#ffb347"/><stop offset="1" stop-color="#b3430f"/></radialGradient>
    <radialGradient id="spill" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff9a2e" stop-opacity=".6"/><stop offset="1" stop-color="#ff9a2e" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".72"><stop offset=".45" stop-color="#05060f" stop-opacity="0"/><stop offset="1" stop-color="#05060f" stop-opacity=".88"/></radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a14"/><stop offset=".6" stop-color="#ffb347"/><stop offset="1" stop-color="#fff0b8"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1c33"/><stop offset="1" stop-color="#090a16"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bricks)"/>
  <!-- floor -->
  <rect y="292" width="640" height="68" fill="url(#floor)"/>
  <path d="M0 292H640" stroke="#0a0b17" stroke-width="4"/>
  <g stroke="#0a0b17" stroke-width="2" opacity=".8"><path d="M320 292V360M200 292L120 360M440 292L520 360M80 292L-40 360M560 292L680 360"/><path d="M0 326H640"/></g>
  <!-- doorway -->
  <path d="M236 360V196a84 84 0 0 1 168 0V360z" fill="url(#door)"/>
  <path d="M236 360V196a84 84 0 0 1 168 0V360" fill="none" stroke="#0a0b17" stroke-width="16"/>
  <path d="M224 360V196a96 96 0 0 1 192 0V360" fill="none" stroke="#3a4066" stroke-width="5"/>
  <path d="M284 360V248a36 36 0 0 1 72 0V360z" fill="#1a0c06" opacity=".55"/>
  <ellipse cx="320" cy="334" rx="170" ry="30" fill="url(#spill)"/>
  <!-- torches -->
  <circle cx="108" cy="150" r="84" fill="url(#glow)"/><circle cx="532" cy="150" r="84" fill="url(#glow)"/>
  <g fill="#0a0b17"><rect x="102" y="162" width="12" height="42" rx="2"/><rect x="526" y="162" width="12" height="42" rx="2"/></g>
  <path d="M108 112c14 16 18 28 8 44-3 5-13 5-16 0-10-16-6-28 8-44z" fill="url(#flame)"/>
  <path d="M532 112c14 16 18 28 8 44-3 5-13 5-16 0-10-16-6-28 8-44z" fill="url(#flame)"/>
  <!-- embers -->
  <g fill="#ffb347"><circle cx="124" cy="96" r="2"/><circle cx="92" cy="84" r="1.5"/><circle cx="520" cy="92" r="2"/><circle cx="548" cy="80" r="1.5"/><circle cx="330" cy="70" r="1.5" opacity=".7"/><circle cx="300" cy="46" r="1.2" opacity=".6"/></g>
  <rect width="640" height="360" fill="url(#vig)"/>
